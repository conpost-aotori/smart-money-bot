name: daily-snapshot

# Posts a Smart Money Daily Snapshot card (built from Hyperliquid public-API
# data) to Discord and X 3× per day.
# JST 00:05 / 08:05 / 16:05 — morning, working hours, evening windows.
# Cron is :05 to dodge the GH Actions top-of-hour rush; the schedule
# trigger is best-effort and can drift 5–15 min under load.
on:
  schedule:
    - cron: '5 15 * * *'  # 00:05 JST  (15:05 UTC, prev day)
    - cron: '5 23 * * *'  # 08:05 JST  (23:05 UTC, prev day)
    - cron: '5 7 * * *'   # 16:05 JST  (07:05 UTC, same day)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip Discord/X posts (preview only)'
        type: boolean
        default: false
      no_x:
        description: 'Skip X (Twitter) post only'
        type: boolean
        default: false
      no_discord:
        description: 'Skip Discord post only'
        type: boolean
        default: false

# Serialize concurrent runs so the bot-state branch (SQLite cache) doesn't
# get clobbered.
concurrency:
  group: bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # Noto Sans CJK is needed for Japanese glyph rendering in the snapshot
      # PNG (image_renderer.py loads /usr/share/fonts/opentype/noto/
      # NotoSansCJK-{Bold,Regular}.ttc). Not pre-installed on ubuntu-latest.
      # apt's fonts-noto-cjk (61 MB) sometimes crawls from the Ubuntu mirror and the
      # job hits timeout-minutes before it can post. Fetch the same .ttc files from the
      # pinned upstream release into the same path apt uses (paths/family names unchanged).
      - name: Install Japanese font (Noto Sans CJK, from upstream release)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          d=/usr/share/fonts/opentype/noto
          sudo mkdir -p "$d"
          base=https://github.com/notofonts/noto-cjk/raw/Sans2.004/Sans/OTC
          for f in NotoSansCJK-Regular.ttc NotoSansCJK-Bold.ttc; do
            sudo curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 120 -o "$d/$f" "$base/$f"
          done
          sudo fc-cache -f >/dev/null
          # grep without -q reads to EOF, so fc-list never gets SIGPIPE under pipefail
          fc-list | grep -F "Noto Sans CJK JP" >/dev/null || { echo "::error::Noto Sans CJK JP not registered"; exit 1; }

      - name: Install
        run: pip install -e .

      - name: Restore state DB from bot-state branch
        run: bash scripts/_ci_state.sh restore

      - name: Build flag args
        id: flags
        run: |
          ARGS=""
          if [[ "${{ inputs.no_x }}" == "true" ]]; then ARGS="$ARGS --no-x"; fi
          if [[ "${{ inputs.no_discord }}" == "true" ]]; then ARGS="$ARGS --no-discord"; fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then ARGS="$ARGS --dry-run"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run daily snapshot
        env:
          DAILY_SNAPSHOT_DISCORD_WEBHOOK_URL: ${{ secrets.DAILY_SNAPSHOT_DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          LOG_LEVEL: INFO
          HYPERLIQUID_USER_AGENT: smart-money-bot/0.1 (+https://github.com/${{ github.repository }})
          HYPERLIQUID_INFO_BASE: https://api.hyperliquid.xyz
        run: python scripts/run_daily.py ${{ steps.flags.outputs.args }}

      - name: Persist state DB
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/_ci_state.sh save
